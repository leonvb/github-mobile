<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src https://api.github.com; base-uri 'self'; form-action 'none'; object-src 'none'">
<title>Pocket Commit</title>
<meta name="description" content="Commit files to any GitHub repository from your phone. A tiny installable static app — your token never leaves your device.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0f14">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f8fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Commit">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon-64.png" sizes="64x64" type="image/png">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./app.css">
</head>
<body>

<div class="app" id="app">
  <header class="topbar">
    <button class="repo-switch" id="repoBtn" type="button">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" class="icon"><use href="#i-commit"/></svg></span>
      <span class="repo-switch-text">
        <span class="repo-switch-name" id="repoName">Pocket Commit</span>
        <span class="repo-switch-sub" id="repoSub">Connect a repository</span>
      </span>
      <svg class="icon chev" aria-hidden="true"><use href="#i-chevron-down"/></svg>
    </button>
    <button class="avatar-btn" id="accountBtn" type="button" aria-label="Account and settings">
      <img id="avatarImg" alt="" hidden>
      <span id="avatarFallback" class="avatar-fallback"><svg class="icon"><use href="#i-key"/></svg></span>
    </button>
  </header>

  <div class="subbar" id="subbar" hidden>
    <button class="chip" id="branchBtn" type="button">
      <svg class="icon" aria-hidden="true"><use href="#i-branch"/></svg>
      <span class="chip-label" id="branchName">main</span>
      <svg class="icon chev" aria-hidden="true"><use href="#i-chevron-down"/></svg>
    </button>
    <nav class="crumbs" id="crumbs" aria-label="Repository path"></nav>
  </div>

  <main class="list" id="list" tabindex="-1"></main>

  <div class="bottombar" id="bottombar" hidden>
    <button class="btn btn-primary btn-block" id="changesBtn" type="button" hidden>
      <svg class="icon" aria-hidden="true"><use href="#i-commit"/></svg>
      <span>Review &amp; commit</span>
      <span class="pill" id="changesCount">0</span>
    </button>
    <div class="bottombar-row">
      <button class="btn btn-soft" id="newFileBtn" type="button">
        <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>
        <span>New file</span>
      </button>
      <button class="btn btn-soft" id="uploadBtn" type="button">
        <svg class="icon" aria-hidden="true"><use href="#i-upload"/></svg>
        <span>Upload</span>
      </button>
    </div>
  </div>
</div>

<!-- Sheet stack -->
<div class="sheet-root" id="sheetRoot"></div>
<div class="toast-root" id="toastRoot" role="status" aria-live="polite"></div>

<input type="file" id="fileInput" multiple hidden>
<script type="module" src="./js/app.js"></script>
</body>
</html>
